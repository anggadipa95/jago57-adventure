<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#07111f">

    <title>JAGO57 Adventure</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #07111f;

            touch-action: none;

            overscroll-behavior: none;

            font-family:
                Arial,
                sans-serif;
        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            min-height: 100dvh;

        }


        #game-container {

            width: 100vw;

            height: 100vh;

            height: 100dvh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            position: relative;

        }


        canvas {

            display: block;

            margin: auto;

            max-width: 100%;

            max-height: 100%;

            touch-action: none;

        }


        /* =========================================
           FULLSCREEN BUTTON
        ========================================= */

        #fullscreen-button {

            position: fixed;

            right: 12px;

            bottom: 12px;

            z-index: 99999;

            border: 2px solid rgba(
                255,
                255,
                255,
                0.35
            );

            border-radius: 10px;

            background:
                rgba(
                    7,
                    17,
                    31,
                    0.80
                );

            color: white;

            font-size: 13px;

            font-weight: bold;

            padding: 10px 14px;

            cursor: pointer;

            user-select: none;

            -webkit-user-select: none;

        }


        #fullscreen-button:active {

            transform: scale(0.96);

        }


        /* =========================================
           PORTRAIT WARNING
        ========================================= */

        #rotate-warning {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100000;

            background: #07111f;

            color: white;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

        }


        #rotate-content {

            max-width: 420px;

        }


        #rotate-icon {

            font-size: 70px;

            margin-bottom: 20px;

        }


        #rotate-title {

            color: #FFD166;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        #rotate-text {

            font-size: 17px;

            line-height: 1.5;

        }


        /* Hanya tampil di HP posisi portrait */

        @media
        (orientation: portrait)
        and
        (max-width: 900px) {

            #rotate-warning {

                display: flex;

            }

        }

    </style>

</head>


<body>


    <div id="game-container"></div>


    <button
        id="fullscreen-button"
        type="button"
    >
        ⛶ FULLSCREEN
    </button>


    <div id="rotate-warning">

        <div id="rotate-content">

            <div id="rotate-icon">
                ↻
            </div>

            <div id="rotate-title">
                PUTAR HP
            </div>

            <div id="rotate-text">

                JAGO57 Adventure dimainkan
                dalam posisi landscape.

                <br><br>

                Putar HP ke posisi mendatar
                untuk mulai bermain.

            </div>

        </div>

    </div>


    <script
        type="module"
        src="/game.js"
    ></script>


    <script>

        const fullscreenButton =
            document.getElementById(
                "fullscreen-button"
            );


        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        const element =
                            document.documentElement;


                        if (
                            element.requestFullscreen
                        ) {

                            await element
                                .requestFullscreen();

                        }


                        else if (
                            element.webkitRequestFullscreen
                        ) {

                            element
                                .webkitRequestFullscreen();

                        }

                    }


                    else {

                        if (
                            document.exitFullscreen
                        ) {

                            await document
                                .exitFullscreen();

                        }


                        else if (
                            document.webkitExitFullscreen
                        ) {

                            document
                                .webkitExitFullscreen();

                        }

                    }

                }

                catch (
                    error
                ) {

                    console.log(
                        "Fullscreen tidak tersedia:",
                        error
                    );

                }

            }
        );


        function updateFullscreenButton() {

            const fullscreen =
                document.fullscreenElement ||
                document.webkitFullscreenElement;


            fullscreenButton.textContent =
                fullscreen

                    ? "✕ EXIT"

                    : "⛶ FULLSCREEN";

        }


        document.addEventListener(
            "fullscreenchange",
            updateFullscreenButton
        );


        document.addEventListener(
            "webkitfullscreenchange",
            updateFullscreenButton
        );

    </script>


</body>

</html>
