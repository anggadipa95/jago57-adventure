<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>JAGO57 Adventure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #07111f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            min-height: 100dvh;

            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        canvas {
            display: block;

            max-width: 100%;
            max-height: 100%;

            margin: auto;

            touch-action: none;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>

    <script
        type="module"
        src="/game.js"
    ></script>

</body>

</html>
