<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#07111f">

    <title>JAGO57 Adventure</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #07111f;

            touch-action: none;
            overscroll-behavior: none;

            -webkit-user-select: none;
            user-select: none;

            font-family: Arial, sans-serif;
        }


        body {
            position: fixed;
            inset: 0;
        }


        #game-container {
            position: absolute;

            inset: 0;

            width: 100vw;

            height: 100vh;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding-top:
                env(safe-area-inset-top);

            padding-right:
                env(safe-area-inset-right);

            padding-bottom:
                env(safe-area-inset-bottom);

            padding-left:
                env(safe-area-inset-left);
        }


        canvas {
            display: block;

            max-width: 100%;
            max-height: 100%;

            margin: auto;

            touch-action: none;

            -webkit-user-select: none;
            user-select: none;
        }

    </style>

</head>


<body>

    <div id="game-container"></div>

    <script
        type="module"
        src="/game.js"
    ></script>

</body>

</html>
